name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # publish only the map page and its JSON, not the databases; web/index.html loads ../data/src/data/map_data.json
      - name: Assemble site
        run: |
          mkdir -p _site/web _site/data/src/data
          cp web/index.html _site/web/
          cp data/src/data/map_data.json _site/data/src/data/
          echo '<meta http-equiv="refresh" content="0; url=web/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
